image: maven:3.9.16-amazoncorretto-21-alpine

pipelines:
  default:
    - step:
        caches:
          - maven
        script:
          - mvn --version
          - mvn clean verify javadoc:jar --settings ./bin/settings.xml
  custom:
    gpg-sign:
      - step:
          name: Sign artifact
          script:
            - echo $GPG_KEY_B64 | base64 -d > /tmp/private.key
            - mvn -B package gpg:sign -Dgpg.signer=bc -Dgpg.useagent=false -Dgpg.keyFilePath=/tmp/private.key -DskipTests

    perform-release:
      - variables:
          - name: releaseVersion
          - name: nextDevVersion
      - step:
          name: Perform release
          oidc: true
          script:
            - pipe: docker://atlassian/packages-oidc-pipe:latest
            - source .envrc
            - mvn --version
            # Annoyingly there are no supported maven base images with JDK 17 and Git
            # Resorting to installing git here
            - apk add git
            - git --version
            - echo $GPG_KEY_B64 | base64 -d > /tmp/private.key
            - mvn -B release:prepare -DreleaseVersion=${releaseVersion} -DdevelopmentVersion=${nextDevVersion} -DscmCommentPrefix="[skip ci]"
            # Important: -Darguments="..." needed to pass args to the release process
            - mvn -B release:perform -DscmCommentPrefix="[skip ci]" -Darguments="-Dgpg.signer=bc -Dgpg.useagent=false -Dgpg.keyFilePath=/tmp/private.key"
