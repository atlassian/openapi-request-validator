openapi: 3.1.0
info:
  title: Exploded Query Array Validation (OAS 3.1)
  version: 1.0.0

paths:
  /items:
    get:
      summary: Exploded form-style array query params
      parameters:
        - name: sort
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 1024
              pattern: '^[A-Za-z0-9_.-]+(,(ASC|DESC))?$'
        - name: ids
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 3
            items:
              type: integer
      responses:
        '200':
          description: Successful response
